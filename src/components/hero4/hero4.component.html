<section class="relative w-full overflow-hidden h-[25vh] md:h-[55vh] flex items-center">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
        <img src="assets/imgs/servicios/fondo.webp" alt="Servicios Background"
            class="w-full h-full object-cover object-center">
    </div>

    <!-- Blue Overlay for dimming effect -->
    <div class="absolute inset-0 bg-[#002B5B] opacity-85 z-[1]"></div>

    <div

        <div class="flex flex-col items-center justify-center animate-fade-in opacity-0">

            <div class="w-[450px] max-w-[85vw] h-[2px] bg-white mb-5 rounded-full hidden md:block"></div>

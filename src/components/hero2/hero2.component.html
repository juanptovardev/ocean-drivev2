<section class="relative w-full overflow-hidden h-[25vh] md:h-[55vh] flex items-center">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
        <img src="assets/imgs/nosotros/hero-nosotros.webp" alt="Nosotros Background" loading="lazy" decoding="async"
            class="w-full h-full object-cover object-center">
    </div>

    <!-- Blue Overlay for dimming effect -->
    <div class="absolute inset-0 bg-[#002B5B] opacity-85 z-[1]"></div>

    <div
        class="container mx-auto px-6 text-center text-white relative z-10 flex flex-col items-center justify-center h-full">

        <!-- Title with elegant fade-in from top -->
        <h1
            class="text-4xl md:text-7xl font-bold leading-tight mb-2 md:mb-6 animate-slide-down opacity-0 tracking-wider">
            {{ lang.t('hero2.title') }}
        </h1>

        <!-- Subtitle with elegant fade-in with delay -->
        <p class="text-xl md:text-4xl max-w-4xl mx-auto animate-fade-in-up opacity-0 font-light leading-relaxed">
            {{ lang.t('hero2.subtitle') }}
        </p>

    </div>

    <style>
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-down {
            animation: slideDown 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards;
        }

        .animate-fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s forwards;
        }
    </style>
</section>

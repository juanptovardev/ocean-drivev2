  <script>
    (function () {
      // ===========================================
      // CACHE CLEARING ON PAGE LOAD
      // ===========================================

      // Clear caches on every page load to prevent bugs
      function clearAllCaches() {
        // Clear service worker caches
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names.forEach(function (name) {
              caches.delete(name);
            });
          });
        }

        // Unregister service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });
        }
      }

      // Execute cache clearing
      clearAllCaches();

      // ===========================================
      // TOKEN EXPIRATION CHECK (2 HOURS)
      // ===========================================

      var TOKEN_EXPIRATION_MS = 2 * 60 * 60 * 1000; // 2 hours

      function checkTokenExpiration() {
        var loginTime = localStorage.getItem('loginTime');
        if (loginTime) {
          var elapsed = Date.now() - parseInt(loginTime, 10);
          if (elapsed >= TOKEN_EXPIRATION_MS) {
            // Token has expired
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('loginTime');
            sessionStorage.setItem('logoutMessage', 'Tu sesión ha expirado. Por favor, inicia sesión nuevamente.');

            // Check if current page requires authentication
            var protectedRoutes = ['/reservas', '/profile', '/admin', '/paso-4', '/paso-5'];
            var currentPath = window.location.pathname;

            var requiresAuth = protectedRoutes.some(function (route) {
              return currentPath.startsWith(route);
            });

            if (requiresAuth) {
              window.location.href = '/login';
            }
          }
        }
      }

      // Check token on page load
      checkTokenExpiration();

      // Check token periodically (every 5 minutes)
      setInterval(checkTokenExpiration, 5 * 60 * 1000);

      // ===========================================
      // FAVICON LOGIC
      // ===========================================

      // Lógica de Favicon:
      // Navegador Claro -> Versión Azul (Logotipo positivo)
      // Navegador Oscuro -> Versión Blanca (Logotipo Negativo)

      // 1. Limpiar enlaces existentes
      var existingLinks = document.querySelectorAll("link[rel*='icon']");
      existingLinks.forEach(function (el) { el.remove(); });

      // 2. Crear nuevo elemento link
      var link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/png';
      document.head.appendChild(link);

      // 3. Definir Assets (Corregido: Negativo es Azul, Positivo es Blanco)
      var blueIcon = 'assets/imgs/logo/LogotipoNegativo.webp'; // Azul (para fondo claro)
      var whiteIcon = 'assets/imgs/logo/LogotipoPositivo.webp'; // Blanco (para fondo oscuro)

      // 4. Función de actualización
      function updateFavicon() {
        try {
          var matcher = window.matchMedia('(prefers-color-scheme: dark)');
          var isDark = matcher.matches;

          // Selección basada en la solicitud del usuario
          // Oscuro -> Blanco
          // Claro -> Azul
          var selectedIcon = isDark ? whiteIcon : blueIcon;

          // Cache busting para forzar actualización
          link.href = selectedIcon + '?v=' + new Date().getTime();

        } catch (e) {
          link.href = blueIcon; // Fallback a azul
        }
      }

      // 5. Inicializar y escuchar cambios
      updateFavicon();

      var matcher = window.matchMedia('(prefers-color-scheme: dark)');
      if (matcher.addEventListener) {
        matcher.addEventListener('change', updateFavicon);
      } else if (matcher.addListener) {
        matcher.addListener(updateFavicon);
      }

      // ===========================================
      // CONSOLE WARNING SUPPRESSION
      // ===========================================

      var origWarn = console.warn;
      console.warn = function () {
        var args = Array.prototype.slice.call(arguments);
        if (args[0] && typeof args[0] === 'string') {
          if (args[0].includes('cdn.tailwindcss.com')) return; // Tailwind CDN warning
          if (args[0].includes('NG0913')) return; // Angular OptimizedImage size warning
        }
        origWarn.apply(console, args);
      };
    })();
  </script>
